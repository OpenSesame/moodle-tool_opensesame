---
image:
  name: '271411534863.dkr.ecr.us-east-2.amazonaws.com/moodleusdev:latest'
  aws:
    access-key: "$AWS_ACCESS_KEY"
    secret-key: "$AWS_SECRET_KEY"
definitions:
  .install-404: &install404
      setphpversion 8.1 ;
      moodle-plugin-ci -vvv install --no-init --branch="MOODLE_404_STABLE" ;
  .install-405: &install405
      setphpversion 8.1 ;
      moodle-plugin-ci -vvv install --no-init --branch="MOODLE_405_STABLE" ;
  .install-500: &install500
      setphpversion 8.2 ;
      moodle-plugin-ci -vvv install --no-init --branch="MOODLE_500_STABLE" ;
  .install-401: &install401full
      setphpversion 8.1 ;
      moodle-plugin-ci -vvv install --branch="MOODLE_401_STABLE" ;
  .install-402: &install402full
      setphpversion 8.1 ;
      moodle-plugin-ci -vvv install --branch="MOODLE_402_STABLE" ;
  .install-403: &install403full
      setphpversion 8.1 ;
      moodle-plugin-ci -vvv install --branch="MOODLE_403_STABLE" ;
  .install-404: &install404full
      setphpversion 8.1 ;
      moodle-plugin-ci -vvv install --branch="MOODLE_404_STABLE" ;
  .install-405: &install405full
      setphpversion 8.1 ;
      moodle-plugin-ci -vvv install --branch="MOODLE_405_STABLE" ;
  .install-500: &install500full
      setphpversion 8.2 ;
      moodle-plugin-ci -vvv install --branch="MOODLE_500_STABLE" ;
  .install-501: &install501full
      setphpversion 8.2 ;
      moodle-plugin-ci -vvv install --branch="MOODLE_501_STABLE" ;
  steps:
    - step: &base
        name: 'Set up Docker, Composer and MariaDB 10.6'
        caches:
          - npm
          - composer
        services:
          - mariadb
  services:
    mariadb:
      image: mariadb:10.11.13
      variables:
        MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: 'yes'
  caches:
    npm:
      path: $HOME/.npm
pipelines:
  default:
    - parallel:
        steps:
          # Moodle 4.4
          - step:
              <<: *base
              name: PHP Lint 4.4
              script:
                - *install404
                - moodle-plugin-ci phplint
          - step:
              <<: *base
              name: PHP Copy detector 4.4
              script:
                - *install404
                - moodle-plugin-ci phpcpd
          - step:
              <<: *base
              name: PHP Mess detector 4.4
              script:
                - *install404
                - moodle-plugin-ci phpmd
          - step:
              <<: *base
              name: PHP Code checker 4.4
              script:
                - *install404
                - moodle-plugin-ci codechecker
          - step:
              <<: *base
              name: PHP Validate 4.4
              script:
                - *install404
                - moodle-plugin-ci validate
          - step:
              <<: *base
              name: PHP Savepoints 4.4
              script:
                - *install404
                - moodle-plugin-ci savepoints
          - step:
              <<: *base
              name: PHP Mustache 4.4
              script:
                - *install404
                - moodle-plugin-ci mustache
          - step:
              <<: *base
              name: PHP Grunt 4.4
              script:
                - *install404
                - moodle-plugin-ci grunt
          - step:
              <<: *base
              name: PHP Doc 4.4
              script:
                - *install404
                - moodle-plugin-ci phpdoc
          - step:
              <<: *base
              name: PHPUnit 4.4
              script:
                - *install404full
                - moodle-plugin-ci phpunit
          - step:
              <<: *base
              name: PHP Deprecations 4.4
              script:
                - *install404
                - moodle-plugin-ci codechecker --standard=/usr/local/mds --max-warnings=1
          # Moodle 4.5
          - step:
              <<: *base
              name: PHP Lint 4.5
              script:
                - *install405
                - moodle-plugin-ci phplint
          - step:
              <<: *base
              name: PHP Copy detector 4.5
              script:
                - *install405
                - moodle-plugin-ci phpcpd
          - step:
              <<: *base
              name: PHP Mess detector 4.5
              script:
                - *install405
                - moodle-plugin-ci phpmd
          - step:
              <<: *base
              name: PHP Code checker 4.5
              script:
                - *install405
                - moodle-plugin-ci codechecker
          - step:
              <<: *base
              name: PHP Validate 4.5
              script:
                - *install405
                - moodle-plugin-ci validate
          - step:
              <<: *base
              name: PHP Savepoints 4.5
              script:
                - *install405
                - moodle-plugin-ci savepoints
          - step:
              <<: *base
              name: PHP Mustache 4.5
              script:
                - *install405
                - moodle-plugin-ci mustache
          - step:
              <<: *base
              name: PHP Grunt 4.5
              script:
                - *install405
                - moodle-plugin-ci grunt
          - step:
              <<: *base
              name: PHP Doc 4.5
              script:
                - *install405
                - moodle-plugin-ci phpdoc
          - step:
              <<: *base
              name: PHPUnit 4.5
              script:
                - *install405full
                - moodle-plugin-ci phpunit
          - step:
              <<: *base
              name: PHP Deprecations 4.5
              script:
                - *install405
                - moodle-plugin-ci codechecker --standard=/usr/local/mds --max-warnings=1
          # Moodle 5.0
          - step:
              <<: *base
              name: PHP Lint 5.0
              script:
                - *install500
                - moodle-plugin-ci phplint
          - step:
              <<: *base
              name: PHP Copy detector 5.0
              script:
                - *install500
                - moodle-plugin-ci phpcpd
          - step:
              <<: *base
              name: PHP Mess detector 5.0
              script:
                - *install500
                - moodle-plugin-ci phpmd
          - step:
              <<: *base
              name: PHP Code checker 5.0
              script:
                - *install500
                - moodle-plugin-ci codechecker
          - step:
              <<: *base
              name: PHP Validate 5.0
              script:
                - *install500
                - moodle-plugin-ci validate
          - step:
              <<: *base
              name: PHP Savepoints 5.0
              script:
                - *install500
                - moodle-plugin-ci savepoints
          - step:
              <<: *base
              name: PHP Mustache 5.0
              script:
                - *install500
                - moodle-plugin-ci mustache
          - step:
              <<: *base
              name: PHP Grunt 5.0
              script:
                - *install500
                - moodle-plugin-ci grunt
          - step:
              <<: *base
              name: PHP Doc 5.0
              script:
                - *install500
                - moodle-plugin-ci phpdoc
          - step:
              <<: *base
              name: PHPUnit 5.0
              script:
                - *install500full
                - moodle-plugin-ci phpunit
          - step:
              <<: *base
              name: PHP Deprecations 5.0
              script:
                - *install500
                - moodle-plugin-ci codechecker --standard=/usr/local/mds --max-warnings=1
          # Moodle 5.0
          - step:
              <<: *base
              name: PHP Lint 5.1
              script:
                - *install501full
                - moodle-plugin-ci phplint
          - step:
              <<: *base
              name: PHP Copy detector 5.1
              script:
                - *install501full
                - moodle-plugin-ci phpcpd
          - step:
              <<: *base
              name: PHP Mess detector 5.1
              script:
                - *install501full
                - moodle-plugin-ci phpmd
          - step:
              <<: *base
              name: PHP Code checker 5.1
              script:
                - *install501full
                - moodle-plugin-ci codechecker
          - step:
              <<: *base
              name: PHP Validate 5.1
              script:
                - *install501full
                - moodle-plugin-ci validate
          - step:
              <<: *base
              name: PHP Savepoints 5.1
              script:
                - *install501full
                - moodle-plugin-ci savepoints
          - step:
              <<: *base
              name: PHP Mustache 5.1
              script:
                - *install501full
                - moodle-plugin-ci mustache
          - step:
              <<: *base
              name: PHP Grunt 5.1
              script:
                - *install501full
                - moodle-plugin-ci grunt
          - step:
              <<: *base
              name: PHP Doc 5.1
              script:
                - *install501full
                - moodle-plugin-ci phpdoc
          - step:
              <<: *base
              name: PHPUnit 5.1
              script:
                - *install501full
                - moodle-plugin-ci phpunit
          - step:
              <<: *base
              name: PHP Deprecations 5.1
              script:
                - *install501full
                - moodle-plugin-ci codechecker --standard=/usr/local/mds --max-warnings=1